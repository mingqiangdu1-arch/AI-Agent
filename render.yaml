services:
  - type: web
    name: ai-agent-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_api_v2.sh
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "2000"
